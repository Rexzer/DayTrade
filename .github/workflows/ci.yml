name: CI

# Reliability floor: every push and PR must pass lint, format check and the
# full offline test suite. A separate job smoke-checks that the FastAPI/DB
# web layer (not exercised by the pure unit tests) at least imports and
# byte-compiles cleanly.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & unit tests (pure)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Black (format check)
        run: black --check .

      - name: Pytest (offline suite)
        # The engine packages are pure-Python; the suite needs no web/DB deps.
        run: pytest

  backend-smoke:
    name: Backend import & compile smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend runtime + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r requirements-dev.txt

      - name: Byte-compile the whole tree
        run: python -m compileall -q backend execution_engine risk_engine strategy_engine market_data backtesting paper_trading analytics assistant notifications

      - name: Import the FastAPI app (no server start)
        # Catches import-time errors in the web layer that the pure tests miss.
        run: python -c "import backend.app.main as m; assert m.create_app() is not None; print('app import OK')"
